name: dreamtogether
description: "Private shared wishlist & life-planning app for couples, families, and small groups."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  http: ^1.2.0
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#6B21A8"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#6B21A8"
    theme_color: "#6B21A8"

flutter_native_splash:
  color: "#1E1B4B"
  image: assets/icon/app_icon_fg.png
  color_dark: "#1E1B4B"
  image_dark: assets/icon/app_icon_fg.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#1E1B4B"
    color_dark: "#1E1B4B"
    image: assets/icon/app_icon_fg.png
    image_dark: assets/icon/app_icon_fg.png
  fullscreen: false

flutter:
  uses-material-design: true
